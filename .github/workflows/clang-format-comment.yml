# Post the clang-format comment from a privileged workflow that never
# checks out the pull request. The artifact is untrusted: it is size-capped,
# allowlisted, and bound to this workflow_run's head SHA before it is used.
# The comment body is fixed here. Only success vs failure is taken from the
# artifact, and only after that binding.
#
# workflow_run runs the workflow file from the default branch, so this file
# comments only after it has been merged. It must stay a separate workflow
# from clang-format.yml (see that file).

name: Clang-Format Comment
on:
  workflow_run:
    workflows: ["Clang-Format"]
    types:
      - completed

concurrency:
  # One group per triggering run. Do not cancel across runs: a shared group
  # can cancel the comment for the current head, and the run that replaced it
  # may then fail the head check, so no comment is posted. The head check
  # below makes an older run a no-op. Comment create/delete is idempotent.
  group: clang-format-comment-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    name: Comment on PR
    runs-on: ubuntu-22.04
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled'
    steps:
      - name: Download clang-format result
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: clang-format-result
          path: ${{ runner.temp }}/clang-format-result
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Missing result after a successful check
        if: steps.download.outcome != 'success' && github.event.workflow_run.conclusion == 'success'
        run: |
          echo "Clang-Format succeeded without a clang-format-result artifact" >&2
          exit 1

      - name: Bind the result to this workflow run
        id: bind
        if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          # Every pull request GitHub attached to this run, not only [0].
          # Two open pulls can share one head SHA.
          EVENT_PRS: ${{ toJson(github.event.workflow_run.pull_requests.*.number) }}
          TRUSTED_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          result_file="${RUNNER_TEMP}/clang-format-result/result"
          if [ -L "$result_file" ] || [ ! -f "$result_file" ]; then
            echo "refusing missing or non-regular result file" >&2
            exit 1
          fi
          size=$(wc -c < "$result_file")
          if [ "$size" -gt 128 ]; then
            echo "refusing oversized result file" >&2
            exit 1
          fi

          mapfile -t lines < "$result_file"
          if [ "${#lines[@]}" -ne 3 ]; then
            echo "refusing result file" >&2
            exit 1
          fi
          outcome="${lines[0]}"
          pr="${lines[1]}"
          run_sha="${lines[2]}"

          case "$outcome" in
            success|failure) ;;
            *) echo "refusing unexpected outcome" >&2; exit 1 ;;
          esac
          case "$pr" in
            ''|*[!0-9]*|0*) echo "refusing unexpected pull request number" >&2; exit 1 ;;
          esac
          normalize_sha() {
            printf '%s' "$1" | tr 'A-F' 'a-f'
          }
          is_sha() {
            case "$1" in
              *[!0-9a-f]*|'') return 1 ;;
            esac
            [ "${#1}" -eq 40 ]
          }
          run_sha=$(normalize_sha "$run_sha")
          trusted_sha=$(normalize_sha "$TRUSTED_RUN_SHA")
          is_sha "$run_sha" || { echo "refusing unexpected artifact sha" >&2; exit 1; }
          is_sha "$trusted_sha" || { echo "refusing unexpected workflow run sha" >&2; exit 1; }
          if [ "$run_sha" != "$trusted_sha" ]; then
            echo "artifact sha does not match workflow_run.head_sha" >&2
            exit 1
          fi

          if [ -n "${EVENT_PRS}" ] && [ "$EVENT_PRS" != "null" ] && [ "$EVENT_PRS" != "[]" ]; then
            if ! printf '%s' "$EVENT_PRS" | jq -e --arg pr "$pr" 'map(tostring) | index($pr) != null' >/dev/null; then
              echo "artifact pull request is not in workflow_run.pull_requests" >&2
              exit 1
            fi
          fi

          pr_json=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}")
          pr_head=$(normalize_sha "$(printf '%s' "$pr_json" | jq -r '.head.sha // empty')")
          is_sha "$pr_head" || { echo "pull request head sha missing" >&2; exit 1; }
          # workflow_run.head_sha is the pull request head at the time of that
          # run. Require it to still be the pull request's current head so a
          # re-run of an older check cannot restore or delete the latest comment.
          if [ "$trusted_sha" != "$pr_head" ]; then
            echo "workflow run sha is not the current pull request head" >&2
            exit 1
          fi

          {
            echo "outcome=${outcome}"
            echo "pr=${pr}"
          } >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        if: steps.bind.outputs.outcome == 'failure'
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          pr-number: ${{ steps.bind.outputs.pr }}
          message: |
            clang-format 20 needs to be run on this PR.
            If you do not have clang-format installed, the maintainer will run it when merging.
            For the exact version please see https://packages.ubuntu.com/questing/clang-format-20.
            An easier way to install it might be through https://apt.llvm.org/#llvmsh.

            _(execution **${{ github.event.workflow_run.id }}** / attempt **${{ github.event.workflow_run.run_attempt }}**)_
          comment-tag: execution
          github-token: ${{ github.token }}

      - name: Comment on PR
        if: steps.bind.outputs.outcome == 'success'
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          pr-number: ${{ steps.bind.outputs.pr }}
          message: |
            _(execution **${{ github.event.workflow_run.id }}** / attempt **${{ github.event.workflow_run.run_attempt }}**)_
          create-if-not-exists: false
          comment-tag: execution
          mode: delete
          github-token: ${{ github.token }}
